grapler:
  range: 10.0            # na jakiej odleglosci haczyk odpala przyciaganie (kratki)
  cooldown-seconds: 60   # cooldown 1 minuta
  air-ticks: 12          # po tylu tickach lotu haczyk odpala sam (20 ticks = 1 s), nawet jak nic nie trafi
  power: 1.0             # sila wyrzutu: wieksza = dalej poleci za hakiem, mniejsza = krotszy lot
  max-speed: 2.4         # limit predkosci lotu
  no-fall-damage: true   # brak obrazen od upadku po uzyciu (6 s)

brata:
  material: NETHERITE_SWORD
  cooldown-seconds: 120  # cooldown 2 minuty
  glowing-seconds: 30
  poison-seconds: 10
  poison-level: 2        # Poison II
